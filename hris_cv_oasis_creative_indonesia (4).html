<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const appId = typeof __app_id !== 'undefined' ? __app_id : 'oasis-hris-default';
  window.__OASIS_CLOUD__ = {
    ready: false,
    appId,
    db: null,
    auth: null,
    user: null,
    doc,
    setDoc,
    onSnapshot
  };

  async function bootCloud() {
    try {
      if (typeof __firebase_config === 'undefined' || !__firebase_config) {
        window.dispatchEvent(new CustomEvent('oasis-cloud-status', { detail: { connected: false } }));
        return;
      }
      const firebaseConfig = JSON.parse(__firebase_config);
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.__OASIS_CLOUD__.user = user;
          window.__OASIS_CLOUD__.db = db;
          window.__OASIS_CLOUD__.auth = auth;
          window.__OASIS_CLOUD__.ready = true;
          window.dispatchEvent(new CustomEvent('oasis-cloud-status', { detail: { connected: true, user } }));
        }
      });
    } catch (err) {
      window.dispatchEvent(new CustomEvent('oasis-cloud-status', { detail: { connected: false } }));
    }
  }

  bootCloud();
</script>

function saveFile(filename, data, mime = 'application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 500);
}

function computeEmployeePayroll(emp, records, hrSettings, customOverride = null) {
  const empAbsences = records.filter(r => r.empId === emp.id && r.category === 'Absensi');
  const totalLateMins = empAbsences.reduce((sum, r) => sum + (r.overrideByAdmin ? 0 : (r.lateMinutes || 0)), 0);

  const hasCustom = customOverride && typeof customOverride === 'object' && (
    customOverride.baseSalary !== undefined ||
    customOverride.allowances !== undefined ||
    customOverride.lateDeduction !== undefined ||
    customOverride.leaveDeduction !== undefined
  );

  const baseSalary = customOverride && customOverride.baseSalary !== undefined ? Number(customOverride.baseSalary) : Number(emp.baseSalary || 0);
  const allowances = customOverride && customOverride.allowances !== undefined ? Number(customOverride.allowances) : Number(emp.allowances || 0);
  const lateDeduction = customOverride && customOverride.lateDeduction !== undefined ? Number(customOverride.lateDeduction) : 0;
  const leaveDeduction = customOverride && customOverride.leaveDeduction !== undefined ? Number(customOverride.leaveDeduction) : 0;
  const periodMonth = (customOverride && customOverride.periodMonth) || new Date().toISOString().slice(0, 7);
  const hrNote = (customOverride && customOverride.hrNote) || '';

  const gross = baseSalary + allowances;
  const totalDeduction = lateDeduction + leaveDeduction;
  const netSalary = Math.max(0, gross - totalDeduction);

  return {
    emp,
    periodMonth,
    hrNote,
    isEditedByHrd: Boolean(hasCustom),
    totalLateMins,
    baseSalary,
    allowances,
    lateDeduction,
    leaveDeduction,
    gross,
    totalDeduction,
    netSalary
  };
}

function exportXlsx(rows, hrSettings, dateStamp) {
  const head = ['No', 'ID Log', 'ID Karyawan', 'Nama', 'Departemen', 'Mode Kerja', 'Kegiatan Lapangan', 'Tanggal', 'Jam Masuk', 'Jam Pulang', 'Lokasi GPS', 'Terlambat (Menit)', 'Denda (Rp)', 'Status'];
  const body = rows.map((r, i) => {
    const late = r.overrideByAdmin ? 0 : r.lateMinutes;
    const status = r.overrideByAdmin ? 'Dispensasi HRD' : late > 0 ? `Terlambat (${late} Menit)` : 'Tepat Waktu';
    const mode = r.workMode || ((r.subType || '').toLowerCase().includes('lapangan') ? 'Tugas Lapangan' : 'Inhouse');
    return [i + 1, r.id, r.empId, r.empName, r.dept, mode, r.fieldActivity || '-', r.date, r.clockIn, r.clockOut, r.location, late, late * hrSettings.lateFinePerMinute, status];
  });
  const ws = XLSX.utils.aoa_to_sheet([head, ...body]);
  ws['!cols'] = [6, 10, 12, 26, 22, 16, 20, 12, 10, 10, 44, 16, 14, 22].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Rekap Presensi');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  saveFile(`Rekap_Presensi_Oasis_${dateStamp}.xlsx`, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

function formatGoogleDriveImageUrl(url) {
  if (!url || typeof url !== 'string') return '';
  const trimmed = url.trim();
  if (!trimmed) return '';
  const fileDMatch = trimmed.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (fileDMatch && fileDMatch[1]) {
    return `https://lh3.googleusercontent.com/d/${fileDMatch[1]}`;
  }
  const openIdMatch = trimmed.match(/drive\.google\.com\/(?:open|uc|thumbnail)\?(?:.*&)?id=([a-zA-Z0-9_-]+)/);
  if (openIdMatch && openIdMatch[1]) {
    return `https://lh3.googleusercontent.com/d/${openIdMatch[1]}`;
  }
  return trimmed;
}

function generateDefaultPassword(employeeId, birthDate) {
  const cleanId = String(employeeId || '').trim().toUpperCase();
  if (birthDate && /^\d{4}-\d{2}-\d{2}$/.test(birthDate)) {
    const [yyyy, mm, dd] = birthDate.split('-');
    return `${cleanId}${dd}${mm}${yyyy}`;
  }
  return `${cleanId}OASIS`;
}

function upsertMasterEmployees(existingList, seedList) {
  const map = new Map();
  (Array.isArray(existingList) ? existingList : []).forEach(emp => {
    const key = String(emp.id || emp.employee_id || '').trim().toUpperCase();
    if (key) map.set(key, emp);
  });

  seedList.forEach(seed => {
    const key = String(seed.employee_id).trim().toUpperCase();
    const prev = map.get(key) || {};
    const effectiveBirthDate = seed.birth_date !== null ? seed.birth_date : (prev.birth_date || null);
    const effectiveBirthPlace = seed.birth_place !== null ? seed.birth_place : (prev.birth_place || null);
    const effectivePhone = seed.no_hp !== null ? seed.no_hp : (prev.no_hp || prev.phone || '');
    const effectiveGender = seed.gender || prev.gender || 'Laki-laki';
    const effectiveRekening = seed.rekening_bca ? seed.rekening_bca : (prev.rekening_bca || '');
    const effectiveDept = seed.departemen || prev.departemen || prev.dept || 'Staff Office';
    const effectiveRole = seed.jabatan || prev.jabatan || prev.role || 'Staff';
    const isHrdAdminRole =
      typeof prev.isDelegatedHrd === 'boolean'
        ? (key === 'EMP0019' || effectiveDept.toUpperCase() === 'HRD' || prev.isDelegatedHrd)
        : (key === 'EMP0019' || effectiveDept.toUpperCase() === 'HRD' || Boolean(prev.userRole && prev.userRole.includes('Admin')));
    const generatedPass = prev.password || generateDefaultPassword(key, effectiveBirthDate);

    map.set(key, {
      ...prev,
      id: key,
      employee_id: key,
      name: seed.nama,
      nama: seed.nama,
      email: prev.email || `${key.toLowerCase()}@oasis.co.id`,
      dept: effectiveDept,
      departemen: effectiveDept,
      role: effectiveRole,
      jabatan: effectiveRole,
      gender: effectiveGender,
      birth_place: effectiveBirthPlace,
      birth_date: effectiveBirthDate,
      no_hp: effectivePhone,
      phone: effectivePhone || '-',
      rekening_bca: effectiveRekening,
      bank: effectiveRekening ? `BCA - ${effectiveRekening}` : (prev.bank || '-'),
      isDelegatedHrd: isHrdAdminRole,
      userRole: isHrdAdminRole ? 'Admin / HRD' : 'Employee / Karyawan',
      password: generatedPass,
      baseSalary: typeof prev.baseSalary === 'number' ? prev.baseSalary : 7500000,
      allowances: typeof prev.allowances === 'number' ? prev.allowances : 1200000,
      photo: prev.photo || FALLBACK_AVATAR,
      kpiScore: typeof prev.kpiScore === 'number' ? prev.kpiScore : 90,
      requiresFieldDuty: false
    });
  });

  return Array.from(map.values()).sort((a, b) => a.id.localeCompare(b.id));
}

function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (deg) => (deg * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return Math.round(R * c);
}

function classifyApprovalCategory(rec) {
  if (rec.category === 'Izin' || rec.category === 'Cuti' || rec.category === 'Sakit' || rec.category === 'Lembur' || rec.category === 'Ganti Jam') {
    return rec.category;
  }
  const combined = `${rec.subType || ''} ${rec.detail || ''}`.toLowerCase();
  if (combined.includes('sakit')) return 'Sakit';
  if (combined.includes('cuti')) return 'Cuti';
  if (combined.includes('lembur')) return 'Lembur';
  if (combined.includes('ganti')) return 'Ganti Jam';
  return 'Izin';
}

  // Core States (Non-Destructive UPSERT Migration + LocalStorage + Cloud Sync)
  const [employees, setEmployees] = useState(() => {
    const saved = LS.getItem('oasis_emp_db_v5');
    if (saved) {
      try {
        return upsertMasterEmployees(JSON.parse(saved), MASTER_EMPLOYEE_SEED_31);
      } catch (e) {}
    }
    const legacy = LS.getItem('oasis_emp_db_v4') || LS.getItem('oasis_emp_db_v3');
    if (legacy) {
      try {
        return upsertMasterEmployees(JSON.parse(legacy), MASTER_EMPLOYEE_SEED_31);
      } catch (e) {}
    }
    return INITIAL_EMPLOYEES;
  });

  const [divisions, setDivisions] = useState(() => {
    const saved = LS.getItem('oasis_divisions_db_v5');
    const parsed = saved ? JSON.parse(saved) : [];
    const merged = Array.from(new Set([...INITIAL_DIVISIONS, ...(Array.isArray(parsed) ? parsed : [])]));
    return merged;
  });
  const [hrSettings, setHrSettings] = useState(() => {
    const saved = LS.getItem('oasis_hr_settings_v3');
    return saved ? JSON.parse(saved) : DEFAULT_HR_SETTINGS;
  });
  const [records, setRecords] = useState(() => {
    const saved = LS.getItem('oasis_records_db_v4');
    return saved ? JSON.parse(saved) : INITIAL_RECORDS;
  });

  const pushToCloud = async (keyName, payload) => {
    try {
      const c = window.__OASIS_CLOUD__;
      if (c && c.ready && c.db && c.doc && c.setDoc) {
        const ref = c.doc(c.db, 'artifacts', c.appId, 'public', 'data', 'oasis_hris_state', keyName);
        await c.setDoc(ref, { value: JSON.stringify(payload), updatedAt: Date.now() }, { merge: true });
      }
    } catch (e) {}
  };

  useEffect(() => {
    const bindCloudSnapshots = () => {
      const c = window.__OASIS_CLOUD__;
      if (!c || !c.ready || !c.db || !c.onSnapshot || !c.doc) return;
      setCloudOnline(true);

        const ref = c.doc(c.db, 'artifacts', c.appId, 'public', 'data', 'oasis_hris_state', key);
        c.onSnapshot(ref, (snap) => {
          if (snap.exists() && snap.data().value !== undefined) {
            try {
              setter(JSON.parse(snap.data().value));
            } catch (e) {}
          } else {
            c.setDoc(ref, { value: JSON.stringify(fallback), updatedAt: Date.now() }, { merge: true }).catch(() => {});
          }
        }, () => {});
      });
    };

    canvas.width = video.videoWidth || 480;
    canvas.height = video.videoHeight || 360;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.82);

      ...targetLog,
      checkoutTime: `${todayStr} ${timeStr}`,
      checkoutLat: gpsCoords.lat,
      checkoutLng: gpsCoords.lng,
      checkoutNotes: (fieldDutyForm.checkoutNotes || '').trim() || 'Kegiatan lapangan selesai dilaksanakan dengan baik.',

    setFieldDutyForm({ ...fieldDutyForm, checkoutNotes: '' });

  // ==========================================

  const filteredAttendanceLogs = useMemo(() => {

      const matchMonth = attendanceFilterMonth === 'ALL' || r.date.startsWith(attendanceFilterMonth);
      const matchDept = attendanceFilterDept === 'ALL' || r.dept === attendanceFilterDept;
      const detectedMode = r.workMode || ((r.subType || '').toLowerCase().includes('lapangan') ? 'Tugas Lapangan' : 'Inhouse');
      const matchMode = attendanceFilterWorkMode === 'ALL' || detectedMode === attendanceFilterWorkMode;
      const matchAct = attendanceFilterActivity === 'ALL' || (r.fieldActivity || '') === attendanceFilterActivity;
      const matchName = !attendanceFilterName.trim() || (r.empName || '').toLowerCase().includes(attendanceFilterName.trim().toLowerCase()) || (r.empId || '').toLowerCase().includes(attendanceFilterName.trim().toLowerCase());
      const matchFrom = !attendanceDateFrom || r.date >= attendanceDateFrom;
      const matchTo = !attendanceDateTo || r.date <= attendanceDateTo;
      return matchMonth && matchDept && matchMode && matchAct && matchName && matchFrom && matchTo;

  }, [records, attendanceFilterMonth, attendanceFilterDept, attendanceFilterWorkMode, attendanceFilterActivity, attendanceFilterName, attendanceDateFrom, attendanceDateTo]);

  const filteredRadarLogs = useMemo(() => {
    return fieldLogs.filter(p => {

      const matchDept = radarDeptFilter === 'ALL' || p.dept === radarDeptFilter;
      const q = radarEmpSearch.trim().toLowerCase();
      const matchEmp = !q || (p.empName || '').toLowerCase().includes(q) || (p.empId || '').toLowerCase().includes(q) || (p.clientOrVenue || '').toLowerCase().includes(q);
      const matchFrom = !radarDateFrom || p.date >= radarDateFrom;
      const matchTo = !radarDateTo || p.date <= radarDateTo;
      return matchAct && matchDept && matchEmp && matchFrom && matchTo;

  // Automatic Birthday Matching (Today's Month & Day vs Employee Birth Date)

    return employees.filter(emp => typeof emp.birth_date === 'string' && emp.birth_date.endsWith(todayMmDd));

  const handleDownloadAttendanceSpreadsheet = (format = 'xls') => {

      return;

    if (format === 'xls') {
      exportXlsx(dataToExport, hrSettings, dateStamp);
      showToast('File Excel (.xlsx) presensi siap diunduh!');

      const headers = ['No', 'ID Log', 'ID Karyawan', 'Nama Karyawan', 'Departemen', 'Mode Kerja', 'Kegiatan', 'Tanggal', 'Jam Masuk', 'Jam Pulang', 'Lokasi GPS', 'Keterlambatan (Menit)', 'Potongan Denda (Rp)', 'Status'];
      const rows = dataToExport.map((rec, idx) => {
        const effectiveLate = rec.overrideByAdmin ? 0 : rec.lateMinutes;
        const fine = effectiveLate * hrSettings.lateFinePerMinute;
        const statusText = rec.overrideByAdmin ? 'Dispensasi HRD' : effectiveLate > 0 ? 'Terlambat' : 'Tepat Waktu';
        const mode = rec.workMode || ((rec.subType || '').toLowerCase().includes('lapangan') ? 'Tugas Lapangan' : 'Inhouse');
        return [idx + 1, rec.id, rec.empId, `"${rec.empName}"`, `"${rec.dept}"`, mode, `"${rec.fieldActivity || '-'}"`, rec.date, rec.clockIn, rec.clockOut, `"${rec.location}"`, effectiveLate, fine, statusText].join(',');
      });
      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      saveFile(`Rekap_Presensi_Oasis_${dateStamp}.csv`, csvContent, 'text/csv;charset=utf-8;');
      showToast('File CSV Spreadsheet presensi berhasil diunduh!');

  const separatedApprovals = useMemo(() => {
    const groups = { Izin: [], Cuti: [], Sakit: [], Lembur: [], 'Ganti Jam': [] };
    records.forEach(r => {
      if (r.category === 'Absensi') return;
      if (approvalStatusFilter !== 'ALL' && r.status !== approvalStatusFilter) return;
      const normalizedCat = classifyApprovalCategory(r);
      if (groups[normalizedCat]) groups[normalizedCat].push(r);
      else groups.Izin.push(r);
    });
    return groups;
  }, [records, approvalStatusFilter]);

  const handleUpdateApprovalStatus = (recordId, newStatus) => {

  const filteredEmployees = useMemo(() => {

  const filteredTasks = useMemo(() => {

    const inProgressCount = weeklyItems.filter(t => t.status === 'In Progress').length;
    const todoCount = weeklyItems.filter(t => t.status === 'To-Do').length;
    const completionPct = weeklyItems.length > 0 ? Math.round((doneCount / weeklyItems.length) * 100) : 0;
    return {
      items: weeklyItems,
      total: weeklyItems.length,
      doneCount,
      inProgressCount,
      todoCount,
      completionPct

  }, [hrdTasks]);

  const monthlyAttendanceStats = useMemo(() => {
    const [yr, mo] = (attendanceChartMonth || '2026-11').split('-').map(Number);
    let workingDays = 22;
    if (yr && mo) {
      const daysInMo = new Date(yr, mo, 0).getDate();
      let weekdays = 0;
      for (let d = 1; d <= daysInMo; d++) {
        const dayOfWeek = new Date(yr, mo - 1, d).getDay();
        if (dayOfWeek !== 0 && dayOfWeek !== 6) weekdays++;
      }
      workingDays = Math.max(1, weekdays);
    }

    return employees.map(emp => {
      const monthRecs = records.filter(
        r => r.empId === emp.id && (r.date || '').startsWith(attendanceChartMonth)
      );
      const presentDates = new Set(
        monthRecs.filter(r => r.category === 'Absensi').map(r => r.date)
      );
      const presentDays = presentDates.size;
      const onTimeDays = monthRecs.filter(
        r => r.category === 'Absensi' && (r.overrideByAdmin || (r.lateMinutes || 0) === 0)
      ).length;
      const percentage = Math.min(100, Math.round((presentDays / workingDays) * 100));
      return {
        emp,
        presentDays,
        onTimeDays,
        workingDays,
        percentage
      };

                    <button

                      title={showLoginPassword ? 'Sembunyikan Password' : 'Lihat Password'}

            <button

                <p className="text-slate-500">CV Oasis Creative Indonesia • Periode {liveDraftPayroll.periodMonth}</p>
              </div>
              <span className="font-mono font-bold text-[#104480]">{liveDraftPayroll.emp.id}</span>
            </div>
            <div className="space-y-1.5">
              <p><strong>Nama:</strong> {liveDraftPayroll.emp.name}</p>
              <p><strong>Departemen:</strong> {liveDraftPayroll.emp.dept} ({liveDraftPayroll.emp.role})</p>
              <p><strong>Rekening BCA:</strong> {liveDraftPayroll.emp.rekening_bca || '-'}</p>
            </div>
            <div className="bg-slate-50 p-4 rounded-2xl space-y-2 border">
              <div className="flex justify-between"><span>Fixed Paid</span><span className="font-mono font-bold">Rp {liveDraftPayroll.baseSalary.toLocaleString('id-ID')}</span></div>
              <div className="flex justify-between"><span>Insentif</span><span className="font-mono font-bold">Rp {liveDraftPayroll.allowances.toLocaleString('id-ID')}</span></div>
              <div className="flex justify-between text-rose-600"><span>Denda Keterlambatan</span><span className="font-mono font-bold">- Rp {liveDraftPayroll.lateDeduction.toLocaleString('id-ID')}</span></div>
              <div className="flex justify-between text-rose-600"><span>Potongan Izin / Absen</span><span className="font-mono font-bold">- Rp {liveDraftPayroll.leaveDeduction.toLocaleString('id-ID')}</span></div>
              {liveDraftPayroll.hrNote && (
                <div className="text-[11px] text-slate-600 bg-white p-2 rounded-lg border">
                  <strong>Catatan HRD:</strong> {liveDraftPayroll.hrNote}
                </div>
              )}
              <div className="flex justify-between font-extrabold text-sm text-[#0b2545] pt-2 border-t">
                <span>GAJI BERSIH (THP)</span>
                <span className="font-mono">Rp {liveDraftPayroll.netSalary.toLocaleString('id-ID')}</span>
              </div>
            </div>
            <div className="flex justify-end gap-2 font-bold">
              <button onClick={() => setShowSlipModal(false)} className="px-4 py-2 border rounded-xl">Tutup</button>
              <button
                onClick={() => {
                  handleDownloadSlipPdf(liveDraftPayroll);
                  setShowSlipModal(false);
                }}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl flex items-center gap-1.5"
              >
                <Download className="w-3.5 h-3.5" /> Download PDF Slip Gaji
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 7. Preview Swafoto Bukti Kehadiran Modal */}
      {previewSelfieRecord && (
        <div className="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl space-y-4 text-xs">
            <div className="flex justify-between items-center border-b pb-3">
              <div>
                <h3 className="font-extrabold text-base text-[#0b2545]">Bukti Swafoto Presensi</h3>
                <p className="text-slate-500">{previewSelfieRecord.empName} • {previewSelfieRecord.date}</p>
              </div>
              <button onClick={() => setPreviewSelfieRecord(null)} className="p-1.5 rounded-lg border"><X className="w-4 h-4" /></button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div className="space-y-1.5">
                <span className="font-bold text-emerald-700 block">Swafoto Absen Masuk ({previewSelfieRecord.clockIn})</span>
                {previewSelfieRecord.selfieInPhoto ? (
                  <img src={previewSelfieRecord.selfieInPhoto} alt="Swafoto Masuk" className="w-full aspect-[4/3] object-cover rounded-2xl border-2 border-emerald-400" />
                ) : (
                  <div className="w-full aspect-[4/3] rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400">Tidak ada foto</div>
                )}
              </div>
              <div className="space-y-1.5">
                <span className="font-bold text-[#104480] block">Swafoto Absen Pulang ({previewSelfieRecord.clockOut})</span>
                {previewSelfieRecord.selfieOutPhoto ? (
                  <img src={previewSelfieRecord.selfieOutPhoto} alt="Swafoto Pulang" className="w-full aspect-[4/3] object-cover rounded-2xl border-2 border-sky-400" />
                ) : (
                  <div className="w-full aspect-[4/3] rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400">Belum absen pulang</div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 8. Konfirmasi Hapus Karyawan Modal */}
      {confirmDeleteEmp && (
        <div className="fixed inset-0 z-50 bg-slate-900/65 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
            <h3 className="font-extrabold text-base text-rose-700">Konfirmasi Hapus Data Karyawan</h3>
            <p className="text-slate-600 leading-relaxed">
              Apakah Anda yakin ingin menghapus <strong>{confirmDeleteEmp.name}</strong> ({confirmDeleteEmp.id}) dari Master Karyawan?
            </p>
            <div className="flex justify-end gap-2 font-bold">
              <button onClick={() => setConfirmDeleteEmp(null)} className="px-4 py-2 border rounded-xl">Batal</button>
              <button
                onClick={() => {
                  updateEmployees(employees.filter(item => item.id !== confirmDeleteEmp.id));
                  showToast(`Karyawan ${confirmDeleteEmp.name} dihapus dari database.`);
                  setConfirmDeleteEmp(null);
                }}
                className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl"
              >
                Ya, Hapus Permanen
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById('root');
if (rootEl) {
  ReactDOM.createRoot(rootEl).render(<App />);
}

})();
</script>
</body>
</html>
